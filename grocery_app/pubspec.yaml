name: grocery_store_manager
description: نظام إدارة محل بقالة متكامل
publish_to: 'none'
version: 1.2.0+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.9.0
  mobile_scanner: ^6.0.0
  intl: ^0.19.0
  pdf: ^3.11.1
  printing: ^5.13.1
  # share_plus 10.x: آخر نسخة تدعم Share.shareXFiles بدون breaking changes
  share_plus: ^10.1.4
  url_launcher: ^6.3.0
  path_provider: ^2.1.5
  excel: ^4.0.6
  audioplayers: ^6.1.0
  # file_picker 10.x: أحدث نسخة تدعم Flutter v2 embedding
  file_picker: ^10.3.7
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/sounds/
